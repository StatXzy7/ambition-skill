<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="452" viewBox="0 0 1280 452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<rect x="45.0" y="28" width="214" height="224" rx="18" fill="#1F252D" stroke="#343B44" stroke-width="1.5"/><circle cx="83.0" cy="72" r="17" fill="#FF7A3D"/><text x="83.0" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="111.0" y="81" font-size="26" font-weight="700" fill="#E6EDF3">读任务</text><text x="69.0" y="138" font-size="18" fill="#9AA3AD">判断类型和大小</text><text x="69.0" y="171" font-size="18" fill="#9AA3AD">小任务只配</text><text x="69.0" y="204" font-size="18" fill="#9AA3AD">一条检查</text><path d="M268.0 131.0 L278.0 140.0 L268.0 149.0" fill="none" stroke="#9AA3AD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="289.0" y="28" width="214" height="224" rx="18" fill="#1F252D" stroke="#343B44" stroke-width="1.5"/><circle cx="327.0" cy="72" r="17" fill="#FF7A3D"/><text x="327.0" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="355.0" y="81" font-size="26" font-weight="700" fill="#E6EDF3">诊断</text><text x="313.0" y="138" font-size="18" fill="#9AA3AD">高度 · 深度</text><text x="313.0" y="171" font-size="18" fill="#9AA3AD">验证 · 广度</text><text x="313.0" y="204" font-size="18" fill="#9AA3AD">找出最弱的一两处</text><path d="M512.0 131.0 L522.0 140.0 L512.0 149.0" fill="none" stroke="#9AA3AD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="533.0" y="28" width="214" height="224" rx="18" fill="#1F252D" stroke="#343B44" stroke-width="1.5"/><circle cx="571.0" cy="72" r="17" fill="#FF7A3D"/><text x="571.0" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="599.0" y="81" font-size="26" font-weight="700" fill="#E6EDF3">取材</text><text x="557.0" y="138" font-size="18" fill="#9AA3AD">从仓库里读真实的</text><text x="557.0" y="171" font-size="18" fill="#9AA3AD">验收脚本、基线</text><text x="557.0" y="204" font-size="18" fill="#9AA3AD">和原始数据</text><path d="M756.0 131.0 L766.0 140.0 L756.0 149.0" fill="none" stroke="#9AA3AD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="777.0" y="28" width="214" height="224" rx="18" fill="#1F252D" stroke="#343B44" stroke-width="1.5"/><circle cx="815.0" cy="72" r="17" fill="#FF7A3D"/><text x="815.0" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="843.0" y="81" font-size="26" font-weight="700" fill="#E6EDF3">选模式</text><text x="801.0" y="138" font-size="18" fill="#9AA3AD">25 个里挑 2–4 个</text><text x="801.0" y="171" font-size="18" fill="#9AA3AD">按短板选</text><text x="801.0" y="204" font-size="18" fill="#9AA3AD">不全叠</text><path d="M1000.0 131.0 L1010.0 140.0 L1000.0 149.0" fill="none" stroke="#9AA3AD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1021.0" y="28" width="214" height="224" rx="18" fill="#1F252D" stroke="#FF7A3D" stroke-width="2.5"/><circle cx="1059.0" cy="72" r="17" fill="#FF7A3D"/><text x="1059.0" y="79" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1087.0" y="81" font-size="26" font-weight="700" fill="#E6EDF3">改写</text><g transform="translate(1191.0,59) scale(1.0)"><path d="M5 9 V6 a6 6 0 0 1 12 0 V9" fill="none" stroke="#6EA8FF" stroke-width="2.6"/><rect x="1" y="9" width="20" height="15" rx="3.5" fill="#6EA8FF"/><circle cx="11" cy="16.5" r="2.2" fill="#1C2A3F"/></g><text x="1045.0" y="138" font-size="18" fill="#9AA3AD">激进目标</text><text x="1045.0" y="171" font-size="18" fill="#9AA3AD">+ 冻结项</text><text x="1045.0" y="204" font-size="18" fill="#9AA3AD">+ 禁止项</text><rect x="45.0" y="284" width="1190.0" height="78" rx="18" fill="#21262D" stroke="#343B44" stroke-width="1.5"/><text x="73.0" y="331" font-size="20" font-weight="700" fill="#FF7A3D">输出</text><rect x="314" y="303" width="72" height="40" rx="20" fill="#1F252D" stroke="#363D46" stroke-width="1.5"/><text x="350" y="329.5" font-size="19" fill="#D0D7DE" text-anchor="middle" font-weight="500">诊断</text><path d="M398 317 L407 323 L398 329" fill="none" stroke="#9AA3AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="420" y="303" width="129" height="40" rx="20" fill="#1F252D" stroke="#363D46" stroke-width="1.5"/><text x="484" y="329.5" font-size="19" fill="#D0D7DE" text-anchor="middle" font-weight="500">用到的模式</text><path d="M561 317 L570 323 L561 329" fill="none" stroke="#9AA3AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="583" y="303" width="167" height="40" rx="20" fill="#FF7A3D" stroke="#FF7A3D" stroke-width="1.5"/><text x="666" y="329.5" font-size="19" fill="#fff" text-anchor="middle" font-weight="600">改写后的提示词</text><path d="M762 317 L771 323 L762 329" fill="none" stroke="#9AA3AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="784" y="303" width="129" height="40" rx="20" fill="#1F252D" stroke="#363D46" stroke-width="1.5"/><text x="848" y="329.5" font-size="19" fill="#D0D7DE" text-anchor="middle" font-weight="500">需要你定的</text><path d="M925 317 L934 323 L925 329" fill="none" stroke="#9AA3AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="947" y="303" width="91" height="40" rx="20" fill="#1F252D" stroke="#363D46" stroke-width="1.5"/><text x="992" y="329.5" font-size="19" fill="#D0D7DE" text-anchor="middle" font-weight="500">下一步</text><path d="M1175.0 362 V406 H105.0 V370" fill="none" stroke="#9AA3AD" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/><path d="M97.0 380 L105.0 368 L113.0 380" fill="none" stroke="#9AA3AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="386" width="576" height="40" rx="20" fill="#0D1117"/><text x="640.0" y="412.5" font-size="18" fill="#9AA3AD" text-anchor="middle">执行后用 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#E6EDF3">/ambition note</tspan> 记下哪个模式起了作用，回收进模式库</text>
</svg>
